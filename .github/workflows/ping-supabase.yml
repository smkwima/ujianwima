name: Ping Supabase

on:
  schedule:
    - cron: '0 */6 * * *'   # tiap 6 jam
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query tabel keepalive
        env:
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          for i in 1 2 3; do
            curl -sS --fail-with-body \
              "https://cnciipsdowdcljjnacxy.supabase.co/rest/v1/keepalive?select=*&limit=1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY"
            echo
            sleep 2
          done
